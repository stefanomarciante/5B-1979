<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Interfaccia Compagni</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 16px;
            background-color: #f0f0f5;
            color: #333;
        }
        .card {
            background-color: #ffffff;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            margin-bottom: 16px;
        }
        h1 {
            font-size: 22px;
            margin-top: 0;
            margin-bottom: 5px;
        }
        p {
            font-size: 15px;
            color: #666;
            margin-top: 0;
            margin-bottom: 15px;
        }

        /* Contenitore immagine */
        #image-container {
            position: relative; 
            width: 100%;
            overflow: hidden;
            border-radius: 8px;
            touch-action: manipulation; /* Evita lo zoom accidentale col doppio tocco su iOS */
        }
        #image-container img {
            width: 100%;
            display: block;
            cursor: crosshair;
        }

        /* Marker cliccabili creati dinamicamente */
        .hotspot {
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: rgba(0, 122, 255, 0.5); /* Blu semi-trasparente */
            border: 2px solid #007aff;
            border-radius: 50%; 
            transform: translate(-50%, -50%); 
            cursor: pointer;
            z-index: 5;
        }

        /* Stile del Popup in stile iOS */
        dialog {
            border: none;
            border-radius: 14px;
            padding: 24px;
            width: 75%;
            max-width: 320px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px); 
        }
        dialog::backdrop {
            background: rgba(0, 0, 0, 0.4); 
        }
        dialog h2 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 22px;
            color: #000;
        }
        
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            color: white;
        }
        .btn-close { background-color: #007aff; }
        .btn-delete { background-color: #ff3b30; }
        
        .btn-export {
            background-color: #34c759;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            margin-top: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Mappatura Classe</h1>
        <p>Tocca un viso per aggiungere un compagno. Tocca un bollino blu per vedere il nome.</p>
        
        <div id="image-container">
            <img src="616b5201-ee8f-4a9c-a13c-b4478999b0f0.jpeg" id="class-photo" alt="Foto di gruppo">
            <!-- I marker verranno iniettati qui da JavaScript -->
        </div>

        <button class="btn-export" onclick="esportaDati()">Esporta Dati JSON</button>
    </div>

    <!-- Popup -->
    <dialog id="popupNome">
        <h2 id="nomeCompagno">Nome Cognome</h2>
        <div class="btn-group">
            <button class="btn btn-delete" onclick="eliminaMarkerAttuale()">Elimina</button>
            <button class="btn btn-close" onclick="chiudiPopup()">Chiudi</button>
        </div>
    </dialog>

    <script>
        const container = document.getElementById('image-container');
        const photo = document.getElementById('class-photo');
        const popup = document.getElementById('popupNome');
        const etichettaNome = document.getElementById('nomeCompagno');
        
        // Carica i dati salvati nella memoria del browser (o crea un array vuoto)
        let classmates = JSON.parse(localStorage.getItem('classmatesData')) || [];
        let markerAttivoId = null;

        // Disegna i marker già salvati al caricamento della pagina
        window.onload = () => {
            classmates.forEach(c => disegnaMarker(c.id, c.x, c.y, c.nome));
        };

        // Gestione tocco sulla foto per aggiungere un nuovo compagno
        photo.addEventListener('click', function(e) {
            const rect = photo.getBoundingClientRect();
            const xPercent = ((e.clientX - rect.left) / rect.width) * 100;
            const yPercent = ((e.clientY - rect.top) / rect.height) * 100;

            const name = prompt("Inserisci Nome e Cognome del compagno:");
            
            if (name && name.trim() !== "") {
                const newId = Date.now(); // Genera un ID univoco basato sul tempo
                
                // Salva nell'array e nella memoria del telefono
                classmates.push({ id: newId, x: xPercent, y: yPercent, nome: name });
                salvaDati();
                
                // Disegna il punto sullo schermo
                disegnaMarker(newId, xPercent, yPercent, name);
            }
        });

        // Funzione per creare fisicamente il bollino blu
        function disegnaMarker(id, x, y, name) {
            const marker = document.createElement('div');
            marker.className = 'hotspot';
            marker.style.left = x + '%';
            marker.style.top = y + '%';
            marker.id = 'marker-' + id;

            // Se tocco un marker esistente, apro il popup
            marker.addEventListener('click', function(e) {
                e.stopPropagation(); // Evita di far scattare il click sulla foto sottostante
                markerAttivoId = id;
                etichettaNome.innerText = name;
                popup.showModal();
            });

            container.appendChild(marker);
        }

        // Chiusura e gestione Popup
        function chiudiPopup() {
            popup.close();
            markerAttivoId = null;
        }

        function eliminaMarkerAttuale() {
            if (markerAttivoId) {
                // Rimuove dall'array
                classmates = classmates.filter(c => c.id !== markerAttivoId);
                salvaDati();
                
                // Rimuove l'elemento visivo
                const markerElement = document.getElementById('marker-' + markerAttivoId);
                if (markerElement) {
                    markerElement.remove();
                }
                chiudiPopup();
            }
        }

        function salvaDati() {
            localStorage.setItem('classmatesData', JSON.stringify(classmates));
        }

        // Esporta i dati finali
        function esportaDati() {
            const jsonOutput = JSON.stringify(classmates, null, 2);
            console.log(jsonOutput);
            alert("Dati copiati negli appunti e visibili in console!");
            navigator.clipboard.writeText(jsonOutput); // Copia automaticamente il JSON negli appunti
        }
    </script>

</body>
</html>
