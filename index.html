<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mappatura Classe - Collaborativa</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 16px;
            background-color: #f0f0f5;
            color: #333;
        }
        .card {
            background-color: #ffffff;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            margin-bottom: 16px;
        }
        h1 { font-size: 20px; margin-top: 0; }
        p { font-size: 14px; color: #666; margin-top: 0; }

        .token-box {
            margin-bottom: 15px;
            display: flex;
            gap: 8px;
        }
        .token-box input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
        }
        .token-box button {
            padding: 8px 14px;
            background-color: #34c759;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
        }

        #image-container {
            position: relative; 
            width: 100%;
            overflow: hidden;
            border-radius: 8px;
            touch-action: manipulation;
        }
        #image-container img {
            width: 100%;
            display: block;
        }

        .hotspot {
            position: absolute;
            width: 22px;
            height: 22px;
            background-color: rgba(0, 122, 255, 0.4);
            border: 2px solid #007aff;
            border-radius: 50%; 
            transform: translate(-50%, -50%); 
            cursor: pointer;
            z-index: 5;
        }

        dialog {
            border: none;
            border-radius: 14px;
            padding: 24px;
            width: 75%;
            max-width: 320px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            background: rgba(255, 255, 255, 0.95);
        }
        dialog::backdrop { background: rgba(0, 0, 0, 0.4); }
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            color: white;
        }
        .btn-close { background-color: #007aff; }
        .btn-delete { background-color: #ff3b30; }
        .status { font-size: 12px; color: #8e8e93; text-align: center; margin-top: 8px; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Mappatura Classe</h1>
        
        <div class="token-box">
            <input type="password" id="ghToken" placeholder="Chiave Accesso GitHub">
            <button onclick="salvaToken()">Salva</button>
        </div>

        <p>Tocca un volto per aggiungere o modificare un compagno.</p>
        
        <div id="image-container">
            <img src="616b5201-ee8f-4a9c-a13c-b4478999b0f0.jpeg" id="class-photo" alt="Foto di gruppo">
        </div>
        
        <div id="status" class="status">Sincronizzazione in corso...</div>
    </div>

    <dialog id="popupNome">
        <h2 id="nomeCompagno">Nome Cognome</h2>
        <div class="btn-group">
            <button class="btn btn-delete" id="btnDelete" onclick="eliminaMarker()">Elimina</button>
            <button class="btn btn-close" onclick="chiudiPopup()">Chiudi</button>
        </div>
    </dialog>

    <script>
        // --- CONFIGURAZIONE REPOSITORY ---
        const REPO_OWNER = "stefanomarciante"; 
        const REPO_NAME = "5B-1979";    
        const FILE_PATH = "dati.json";
        // ----------------------------------

        const photo = document.getElementById('class-photo');
        const container = document.getElementById('image-container');
        const popup = document.getElementById('popupNome');
        const statusEl = document.getElementById('status');
        
        let classmates = [];
        let fileSHA = ""; 
        let markerAttivoId = null;

        document.getElementById('ghToken').value = localStorage.getItem('gh_token') || '';

        function salvaToken() {
            const token = document.getElementById('ghToken').value.trim();
            localStorage.setItem('gh_token', token);
            alert("Chiave salvata!");
        }

        // Funzione per la codifica/decodifica sicura dei caratteri speciali (UTF-8)
        function base64ToUtf8(str) {
            return decodeURIComponent(atob(str).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
        }
        function utf8ToBase64(str) {
            return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, (match, p1) => String.fromCharCode('0x' + p1)));
        }

        async function caricaDatiDaGitHub() {
            statusEl.innerText = "Caricamento dati...";
            try {
                const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`, {
                    headers: { 'Cache-Control': 'no-cache' }
                });
                if (res.ok) {
                    const data = await res.json();
                    fileSHA = data.sha;
                    const content = base64ToUtf8(data.content);
                    classmates = JSON.parse(content);
                    disegnaTuttiIMarker();
                    statusEl.innerText = "Dati aggiornati";
                }
            } catch (err) {
                statusEl.innerText = "Errore nel caricamento dati";
            }
        }

        function disegnaTuttiIMarker() {
            document.querySelectorAll('.hotspot').forEach(el => el.remove());
            classmates.forEach(c => disegnaMarker(c.id, c.x, c.y, c.nome));
        }

        function disegnaMarker(id, x, y, name) {
            const marker = document.createElement('div');
            marker.className = 'hotspot';
            marker.style.left = x + '%';
            marker.style.top = y + '%';
            marker.id = 'marker-' + id;

            marker.addEventListener('click', (e) => {
                e.stopPropagation();
                markerAttivoId = id;
                document.getElementById('nomeCompagno').innerText = name;
                popup.showModal();
            });

            container.appendChild(marker);
        }

        photo.addEventListener('click', async (e) => {
            const token = localStorage.getItem('gh_token');
            if (!token) {
                alert("Inserisci la chiave di accesso in alto.");
                return;
            }

            const rect = photo.getBoundingClientRect();
            const xPercent = ((e.clientX - rect.left) / rect.width) * 100;
            const yPercent = ((e.clientY - rect.top) / rect.height) * 100;

            const name = prompt("Inserisci Nome e Cognome:");
            if (name && name.trim() !== "") {
                const newId = Date.now();
                classmates.push({ id: newId, x: xPercent, y: yPercent, nome: name.trim() });
                await salvaSuGitHub();
            }
        });

        async function salvaSuGitHub() {
            const token = localStorage.getItem('gh_token');
            if (!token) return;

            statusEl.innerText = "Salvataggio in corso...";

            try {
                let currentSha = fileSHA;
                const resGet = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`, {
                    headers: { 
                        'Authorization': `Bearer ${token}`,
                        'Cache-Control': 'no-cache' 
                    }
                });
                
                if (resGet.ok) {
                    const currentData = await resGet.json();
                    currentSha = currentData.sha;
                }

                const jsonString = JSON.stringify(classmates, null, 2);
                const contentBase64 = utf8ToBase64(jsonString); // Utilizza il nuovo metodo sicuro

                const resPut = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: "Aggiornamento mappatura compagni",
                        content: contentBase64,
                        sha: currentSha
                    })
                });

                const resData = await resPut.json();

                if (resPut.ok) {
                    fileSHA = resData.content.sha;
                    disegnaTuttiIMarker();
                    statusEl.innerText = "Salvato con successo!";
                } else {
                    alert(`Errore GitHub ${resPut.status}: ${resData.message}`);
                    statusEl.innerText = "Errore di salvataggio";
                }
            } catch (err) {
                // Ora l'errore stamperà il motivo esatto del blocco
                alert(`Errore di sistema: ${err.message}`);
                statusEl.innerText = "Connessione interrotta";
            }
        }

        async function eliminaMarker() {
            if (markerAttivoId) {
                classmates = classmates.filter(c => c.id !== markerAttivoId);
                chiudiPopup();
                await salvaSuGitHub();
            }
        }

        function chiudiPopup() {
            popup.close();
            markerAttivoId = null;
        }

        caricaDatiDaGitHub();
    </script>

</body>
</html>
