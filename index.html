<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Interfaccia Compagni</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 16px;
            background-color: #f0f0f5;
            color: #333;
        }
        .card {
            background-color: #ffffff;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            margin-bottom: 16px;
        }
        h1 {
            font-size: 22px;
            margin-top: 0;
            margin-bottom: 5px;
        }
        p {
            font-size: 15px;
            color: #666;
            margin-top: 0;
            margin-bottom: 15px;
        }

        .image-wrapper {
            position: relative; 
            width: 100%;
            overflow: hidden;
            border-radius: 8px;
        }
        .image-wrapper img {
            width: 100%;
            display: block;
        }

        .hotspot {
            position: absolute;
            background-color: rgba(0, 122, 255, 0.4); 
            border-radius: 50%; 
            cursor: pointer;
            transform: translate(-50%, -50%); 
        }

        dialog {
            border: none;
            border-radius: 14px;
            padding: 24px;
            width: 75%;
            max-width: 320px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px); 
        }
        dialog::backdrop {
            background: rgba(0, 0, 0, 0.4); 
        }
        dialog h2 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 22px;
            color: #000;
        }
        .btn-close {
            background-color: #007aff;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
        }
        .btn-close:active {
            background-color: #005bb5;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>La mia Classe</h1>
        <p>Tocca un volto per scoprire chi è.</p>
        
        <div class="image-wrapper">
            <img src="616b5201-ee8f-4a9c-a13c-b4478999b0f0.jpeg" alt="Foto di gruppo">
            
            <!-- VOLTO 1 -->
            <div class="hotspot" 
                 style="top: 30%; left: 25%; width: 15%; height: 15%;" 
                 onclick="mostraNome('Mario Rossi')">
            </div>

            <!-- VOLTO 2 -->
            <div class="hotspot" 
                 style="top: 45%; left: 70%; width: 12%; height: 12%;" 
                 onclick="mostraNome('Giulia Bianchi')">
            </div>
        </div>
    </div>

    <dialog id="popupNome">
        <h2 id="nomeCompagno">Nome Cognome</h2>
        <button class="btn-close" onclick="chiudiPopup()">Chiudi</button>
    </dialog>

    <script>
        const popup = document.getElementById('popupNome');
        const etichettaNome = document.getElementById('nomeCompagno');

        function mostraNome(nome) {
            etichettaNome.innerText = nome; 
            popup.showModal();              
        }

        function chiudiPopup() {
            popup.close();                  
        }
    </script>

</body>
</html>
